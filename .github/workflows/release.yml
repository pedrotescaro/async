name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Confirm tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(bun -e 'console.log(require("./package.json").version)')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
            artifact: linux
            attestation_files: |
              release/*.AppImage
              release/*.deb
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: windows-latest
            script: package:win:signed
            artifact: windows
            attestation_files: release/*.exe
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Configure WIN_CSC_LINK (or CSC_LINK) before publishing a Windows release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Configure WIN_CSC_KEY_PASSWORD (or CSC_KEY_PASSWORD) before publishing a Windows release.'
          }
      - name: Package application
        run: bun run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem release -Filter 'ASYNC-Setup-*.exe'
            Get-Item release/win-unpacked/ASYNC.exe
          )
          if ($targets.Count -lt 2) {
            throw 'Expected the packaged ASYNC executable and NSIS installer.'
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($target.Name) has invalid Authenticode status: $($signature.Status)"
            }
            Write-Host "$($target.Name) signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.attestation_files }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_TAG}" --generate-notes --title "ASYNC ${RELEASE_TAG}" || true
          gh release upload "${RELEASE_TAG}" release-files/* --clobber

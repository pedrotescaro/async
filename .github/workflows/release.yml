name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Confirm tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(bun --print \"require('./package.json').version\")"
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
            artifact: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: windows-latest
            script: package:win
            artifact: windows
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "ASYNC ${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" release-files/* --clobber
